[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dac-sim"
version = "0.1.0"
description = "Heat-linked roller-belt direct air capture simulation"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]